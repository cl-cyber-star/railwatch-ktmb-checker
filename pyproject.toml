[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "railwatch-ktmb-checker"
version = "2.0.0"
description = "Python browser worker for Railwatch KTMB seat availability monitors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography==46.0.0",
  "httpx==0.28.1",
  "playwright==1.55.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
]

[project.optional-dependencies]
frontend = [
  "streamlit==1.60.0",
]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.0",
  "streamlit==1.60.0",
]

[project.scripts]
railwatch = "railwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["railwatch"]

[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true
