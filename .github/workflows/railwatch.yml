name: Railwatch KTMB Checker
run-name: Railwatch check (${{ github.event_name }})

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: railwatch-ktmb-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      RAILWATCH_API_URL: ${{ secrets.RAILWATCH_API_URL }}
      RAILWATCH_CHECKER_SECRET: ${{ secrets.RAILWATCH_CHECKER_SECRET }}
      OAI_SITES_AUTHORIZATION: ${{ secrets.OAI_SITES_AUTHORIZATION }}
      KTMB_STORAGE_STATE_B64: ${{ secrets.KTMB_STORAGE_STATE_B64 }}

    steps:
      - name: Log workflow trigger
        env:
          RAILWATCH_TRIGGER: ${{ github.event_name }}
          RAILWATCH_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Workflow trigger: ${RAILWATCH_TRIGGER}"
          if [ -n "${RAILWATCH_SCHEDULE}" ]; then
            echo "Cron schedule: ${RAILWATCH_SCHEDULE}"
          else
            echo "Cron schedule: manual dispatch"
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-worker.txt

      - name: Install checker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-worker.txt
          python -m pip install --no-deps .

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate configuration
        run: python -m railwatch doctor

      - name: Check KTMB ordinary seats
        run: python -m railwatch check