name: Railwatch KTMB Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: railwatch-ktmb-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    defaults:
      run:
        working-directory: runner

    env:
      RAILWATCH_API_URL: ${{ secrets.RAILWATCH_API_URL }}
      RAILWATCH_CHECKER_SECRET: ${{ secrets.RAILWATCH_CHECKER_SECRET }}
      OAI_SITES_AUTHORIZATION: ${{ secrets.OAI_SITES_AUTHORIZATION }}
      KTMB_STORAGE_STATE_B64: ${{ secrets.KTMB_STORAGE_STATE_B64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: runner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check KTMB ordinary seats
        run: npm run check
